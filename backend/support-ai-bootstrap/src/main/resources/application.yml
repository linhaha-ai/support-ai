server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: support-ai
  datasource:
    url: jdbc:postgresql://localhost:5432/supportai
    username: supportai
    password: supportai
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ollama
      embedding: ollama
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
      rerank: none
      video: none
    dashscope:
      enabled: false
      base-url: https://dashscope.aliyuncs.com
      agent:
        enabled: false
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat:
        options:
          model: qwen2.5:3b
      embedding:
        options:
          model: bge-m3
    retry:
      max-attempts: 1
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    defaults:
      enabled: false
    db:
      enabled: true
    ping:
      enabled: true
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn
sa-token:
  token-name: support-ai-token
  timeout: 1800
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  is-read-body: false
  is-read-header: false
  is-read-cookie: true
  is-lasting-cookie: false
  is-write-header: false
  token-style: random-64
  is-log: false
  is-print: false
  cookie:
    path: /
    http-only: true
    same-site: Lax
    secure: false
support:
  ai:
    connect-timeout: 10s
    read-timeout: 180s
    dimensions: 1024
logging:
  level:
    com.alibaba.cloud.ai.dashscope: OFF
    org.springframework.ai.retry: OFF
