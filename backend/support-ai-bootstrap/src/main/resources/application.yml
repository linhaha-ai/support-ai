server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: support-ai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:postgresql://localhost:5432/supportai
    username: supportai
    password: supportai
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ollama
      embedding: ollama
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
      rerank: none
      video: none
    dashscope:
      enabled: false
      base-url: https://dashscope.aliyuncs.com
      agent:
        enabled: false
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat:
        options:
          model: qwen2.5:3b
      embedding:
        options:
          model: bge-m3
    retry:
      max-attempts: 1
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    defaults:
      enabled: false
    db:
      enabled: true
    ping:
      enabled: true
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
knife4j:
  # 4.5.0 增强器依赖旧版 springdoc 的 List 方法签名，与当前 Set 签名不兼容。
  # 关闭增强后仍由 springdoc 生成 OpenAPI，/doc.html 沿用现有登录保护。
  enable: false
  production: false
sa-token:
  token-name: support-ai-token
  timeout: 1800
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  is-read-body: false
  is-read-header: false
  is-read-cookie: true
  is-lasting-cookie: false
  is-write-header: false
  token-style: random-64
  is-log: false
  is-print: false
  cookie:
    path: /
    http-only: true
    same-site: Lax
    secure: false
support:
  ai:
    connect-timeout: 10s
    read-timeout: 180s
    dimensions: 1024
    storage:
      root: .local/storage
    document:
      upload:
        max-file-size: 5MB
        parser-version: plain-text-v1
        chunker-version: token-budget-v1
        max-attempts: 3
      cleanup:
        enabled: true
        poll-interval: 10s
        lease-duration: 5m
        retry-delay: 30s
      parsing:
        max-tokens: 512
        max-chunks: 20000
      embedding:
        batch-size: 10
    rag:
      top-k: 6
      # F24 真实开发集调参前使用无损阈值；预算覆盖当前 TopK 与单块上限。
      max-evidence-tokens: 4096
      minimum-vector-score: -1.0
      minimum-fusion-score: 0.0
      minimum-rerank-score: 0.0
      history-max-rounds: 3
      history-max-characters: 6000
      query-rewrite-enabled: true
      query-rewrite-max-characters: 500
    retrieval:
      # 未完成同一开发集真实对比前保持纯向量，融合策略需显式启用。
      strategy: VECTOR
      candidate-multiplier: 3
      rrf-k: 60
      max-keywords: 8
    rerank:
      # 未完成同一开发集真实对比前保持关闭；地址必须指向 qwen3-rerank 的兼容接口。
      enabled: ${SUPPORT_AI_RERANK_ENABLED:false}
      model: qwen3-rerank
      endpoint: ${SUPPORT_AI_RERANK_ENDPOINT:}
      candidate-multiplier: 3
      max-candidates: 50
      max-estimated-item-tokens: 3500
      max-estimated-request-tokens: 100000
      timeout: 5s
      instruction: Given a web search query, retrieve relevant passages that answer the query.
    chat:
      stream:
        pool-size: 4
        queue-capacity: 32
        max-question-length: 2000
        max-concurrent-runs-per-user: 2
        timeout: 200s
        execution-timeout: 180s
    assistant:
      agent:
        # ReactAgent 仅允许在这些预算内使用服务端白名单工具。
        max-tool-calls: 2
        max-model-calls: 3
        max-context-tokens: 8000
        recursion-limit: 16
        tool-timeout: 20s
        execution-timeout: 60s
    ingestion:
      worker:
        enabled: true
        pool-size: 2
        queue-capacity: 16
        poll-interval: 5s
        lease-duration: 60s
        heartbeat-interval: 15s
        retry-delay: 10s
logging:
  level:
    com.alibaba.cloud.ai.dashscope: OFF
    org.springframework.ai.retry: OFF
