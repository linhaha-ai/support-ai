server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: support-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supportai}
    username: ${DB_USERNAME:supportai}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:ollama}
      embedding: ${AI_EMBEDDING_PROVIDER:ollama}
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
      rerank: none
      video: none
    dashscope:
      enabled: false
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      workspace-id: ${DASHSCOPE_WORKSPACE_ID:}
      agent:
        enabled: false
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
          dimensions: 1024
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen2.5:3b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    retry:
      max-attempts: 1
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    defaults:
      enabled: false
    db:
      enabled: true
    ping:
      enabled: true
support:
  ai:
    connect-timeout: ${AI_CONNECT_TIMEOUT:10s}
    read-timeout: ${AI_READ_TIMEOUT:180s}
    dimensions: 1024
logging:
  level:
    com.alibaba.cloud.ai.dashscope: OFF
    org.springframework.ai.retry: OFF
